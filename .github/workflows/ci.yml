name: CI
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run --locked pytest
      - run: uv run --locked tach check
      - run: uv run --locked python scripts/check_cycles.py
