<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{% block title %}Questionnaire{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <style>
      /* The OcéEns palette, in light mode only: the page does not follow the
         system's dark setting. */
      :root {
        color-scheme: light;
        --violet: #470a68;
        --violet-survol: #5c1a7a;
        --violet-doux: #f7f1fa;
        --rouge: #df231d;
        --fond: #f5f4f0;
        --surface-douce: #f5f7fa;
        --trait: #dce4ec;
        --texte: #1a1a1a;
        --texte-second: #556170;
        --texte-discret: #7f8fa6;
        --vert: #22a06b;
        --degrade: linear-gradient(135deg, var(--violet), var(--rouge));
      }
      body {
        margin: 0;
        font-family: Montserrat, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 1rem;
        line-height: 1.65;
        color: var(--texte);
        background: var(--fond);
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 5rem;
      }
      a { color: var(--violet); }
      a:hover { color: var(--violet-survol); }
      h1, h2, h3 { line-height: 1.3; }
      h1 { font-size: 2rem; font-weight: 700; color: var(--violet); margin: 0 0 1rem; }
      h3 { margin-top: 2.25rem; font-size: 1.1rem; color: var(--violet); }
      code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
      :not(pre) > code {
        padding: 0.1em 0.35em;
        background: var(--violet-doux);
        border-radius: 0.3rem;
      }
      pre {
        padding: 0.75rem 1rem;
        overflow-x: auto;
        background: var(--surface-douce);
        border: 1px solid var(--trait);
        border-radius: 0.5rem;
      }
      pre.mermaid { background: none; border: none; text-align: center; }
      table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
      th, td { padding: 0.5rem 0.75rem; border: 1px solid var(--trait); text-align: left; }
      th { background: var(--violet-doux); color: var(--violet); font-weight: 600; }
      blockquote {
        margin: 1rem 0;
        padding-left: 1rem;
        color: var(--texte-second);
        border-left: 3px solid var(--trait);
      }
      button {
        padding: 0.7rem 1.5rem;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--violet);
        border: none;
        border-radius: 999px;
        cursor: pointer;
      }
      button:hover { background: var(--violet-survol); }
      .avis {
        max-width: 34rem;
        margin: 15vh auto;
        padding: 2rem 2.25rem;
        background: #fff;
        border: 1px solid var(--trait);
        border-top: 4px solid var(--violet);
        border-radius: 0.75rem;
      }
      .avis h1 { font-size: 1.5rem; }
      .avis p { color: var(--texte-second); }
      {% block style %}{% endblock %}
    </style>
  </head>
  <body>
    <main>{% block main %}{% endblock %}</main>
    {% block scripts %}{% endblock %}
  </body>
</html>
