<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{% block title %}Questionnaire{% endblock %}</title>
    <style>
      :root {
        color-scheme: light dark;
        --trait: color-mix(in srgb, currentColor 20%, transparent);
        --fond-doux: color-mix(in srgb, currentColor 5%, transparent);
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 1.05rem;
        line-height: 1.6;
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 5rem;
      }
      h1 { line-height: 1.25; }
      h2 {
        margin-top: 3rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--trait);
      }
      h3 { margin-top: 2.5rem; }
      code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      pre {
        padding: 0.75rem 1rem;
        overflow-x: auto;
        background: var(--fond-doux);
        border-radius: 0.5rem;
      }
      pre.mermaid { background: none; text-align: center; }
      table { border-collapse: collapse; width: 100%; }
      th, td { padding: 0.4rem 0.7rem; border: 1px solid var(--trait); text-align: left; }
      blockquote {
        margin: 1rem 0;
        padding-left: 1rem;
        border-left: 3px solid var(--trait);
      }
      .reponse { margin: 1.25rem 0 2rem; }
      .reponse label {
        display: block;
        margin-bottom: 0.35rem;
        font-weight: 600;
        font-size: 0.95rem;
      }
      .reponse textarea {
        display: block;
        width: 100%;
        box-sizing: border-box;
        min-height: 7.5rem;
        padding: 0.7rem 0.8rem;
        font: inherit;
        font-size: 1rem;
        color: inherit;
        background: var(--fond-doux);
        border: 1px solid var(--trait);
        border-radius: 0.5rem;
        resize: vertical;
      }
      .note {
        margin-top: 3rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--trait);
        font-size: 0.95rem;
        opacity: 0.8;
      }
      .avis { max-width: 34rem; margin: 15vh auto; padding: 0 1.25rem; }
    </style>
  </head>
  <body>
    <main>{% block main %}{% endblock %}</main>
    {% block scripts %}{% endblock %}
  </body>
</html>
